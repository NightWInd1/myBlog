      content="晚风的个人博客，记录技术探索、生活随想与日常灵感。"
    />

    <link
      rel="alternate"
      type="application/rss+xml"
      title="晚风的博客"
      href="/feed/"
    />
    <title>晚风的博客</title>
    <script>
      ;(function () {
        var theme = 'light'
        try {
          var stored = localStorage.getItem('blog-theme')
          if (stored === 'dark' || stored === 'light') {
            theme = stored
          }
          if (stored === 'system') {
            theme = matchMedia('(prefers-color-scheme: dark)').matches
              ? 'dark'
              : 'light'
          }
          var hue = Number(localStorage.getItem('blog-hue'))
          if (
            localStorage.getItem('blog-hue') !== null &&
            Number.isFinite(hue) &&
            hue >= 0 &&
            hue <= 360
          )
            document.documentElement.style.setProperty('--hue', hue)
        } catch (e) {}
        document.documentElement.setAttribute('data-theme', theme)
      })()
    </script>
